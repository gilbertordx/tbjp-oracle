[package]
name = "tbjp-oracle"
version = "0.1.0"
edition = "2024"
description = "Search Jordan Peters' forum archive (Rust remaster of the Python ARCHIVE app)"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
